name: build-guide

on:
  schedule:
    - cron: "30 1 * * *"   # daily 01:30 UTC = 07:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-guide
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build guide
        run: python build_guide.py
      - name: Commit and push if changed
        run: |
          git config user.name "ccgtv-epg bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/guide_in.xml.gz
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "guide: $(date -u +%Y-%m-%d)"
          git push
